[project]
name = "interview-ai"
version = "0.1.0"
description = "Job-ad-driven mock technical interviewer (Streamlit + OpenRouter/gpt-5-nano)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "python-dotenv>=1.0",
    "openai>=1.59,<2",
    "instructor>=1.7,<2",
    "pydantic>=2.10,<3",
    "tenacity>=9.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
]

[dependency-groups]
# Evaluation statistics. Deliberately NOT runtime dependencies -- the Streamlit app never
# imports these, so a normal `uv sync` keeps the app light.
eval = [
    "pyyaml>=6.0",          # evaluation/thresholds.yaml
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "tabulate>=0.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    {include-group = "eval"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` so the package imports without a reinstall; `.` so `evaluation` and `tests.conftest` do.
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "live: hits the real OpenRouter API (costs money); run with -m live",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The prompt text ships with the package -- see src/interview_ai/prompts/README.md.
interview_ai = ["prompts/**/*.txt", "prompts/**/*.md"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
